<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<title>Найди бутылку — зал</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:#0d0d10;color:#eee;font-family:monospace;overflow:hidden;position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:6px;left:6px;right:6px;display:flex;justify-content:space-between;font-size:11px;pointer-events:none;text-shadow:0 1px 3px #000;z-index:5}
#topBtns{position:fixed;top:6px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:12}
#topBtns button{width:42px;height:42px;border-radius:50%;background:rgba(255,140,0,0.9);color:#111;font-size:15px;font-weight:bold;border:2px solid #f80;box-shadow:0 2px 6px rgba(0,0,0,0.6)}
#viewBtn{font-size:16px!important}
#accBtn{font-size:11px!important;border-radius:12px!important}
#pauseMenu,#upgMenu,#accMenu,#netMenu,#promoMenu{position:fixed;inset:0;background:rgba(5,5,8,0.96);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:45;padding:14px;overflow-y:auto}
#pauseMenu h2,#upgMenu h2,#accMenu h2,#netMenu h2,#promoMenu h2{color:#f80;font-size:18px}
#pauseMenu button,#upgMenu button,#accMenu button,#netMenu button,#promoMenu button{padding:12px;background:#f80;color:#111;border:none;border-radius:10px;font-size:14px;font-family:monospace;font-weight:bold;width:100%;max-width:340px;box-shadow:0 2px 8px rgba(255,140,0,0.3)}
#accMenu input,#netMenu input,#promoMenu input{width:100%;max-width:340px;padding:12px;background:#1a1a22;border:2px solid #f80;border-radius:8px;color:#eee;font-size:14px;font-family:monospace}
#accMsg{color:#f55;font-size:12px;min-height:16px;text-align:center}
#promoMsg{color:#f55;font-size:12px;min-height:16px;text-align:center}
#accName{color:#3fc;font-size:18px;font-weight:bold}
#netCode{color:#3fc;font-size:13px;text-align:center;min-height:18px}
#netStatus{color:#aaa;font-size:12px;text-align:center}
#netScore{display:none;position:fixed;top:54px;left:50%;transform:translateX(-50%);font-size:22px;font-weight:bold;color:#f80;z-index:6;text-shadow:0 1px 3px #000}
#joy{position:fixed;bottom:max(30px,env(safe-area-inset-bottom));left:20px;width:130px;height:130px;border-radius:50%;background:rgba(255,140,0,0.12);border:2px solid rgba(255,140,0,0.4)}
#knob{position:absolute;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffb347,#f80);left:37px;top:37px;box-shadow:0 2px 8px rgba(0,0,0,0.6)}
#btn{position:fixed;bottom:max(40px,env(safe-area-inset-bottom));right:22px;width:105px;height:105px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffb347,#f80);color:#111;font-weight:bold;font-size:13px;display:flex;align-items:center;justify-content:center;border:3px solid #ffcc66;box-shadow:0 4px 12px rgba(255,140,0,0.4)}
#ctx{position:fixed;bottom:190px;left:50%;transform:translateX(-50%);display:none;gap:8px;flex-wrap:wrap;justify-content:center;z-index:8;width:95%}
#ctx button{padding:12px 16px;background:#f80;color:#111;border:none;border-radius:8px;font-family:monospace;font-weight:bold;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,0.5)}
#shop{position:fixed;inset:0;background:rgba(5,5,8,0.94);display:none;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;padding:60px 12px 20px;overflow-y:auto;z-index:15}
#shop h2{color:#f80;font-size:17px}
.loc-btn{width:100%;max-width:360px;padding:12px;background:#1a1a22;border:2px solid #f80;border-radius:8px;color:#eee;font-size:13px;font-family:monospace}
#close{position:fixed;top:10px;right:10px;width:42px;height:42px;border-radius:50%;background:#c33;color:#fff;font-size:20px;border:none;z-index:20}#msg{position:fixed;bottom:260px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);color:#f80;padding:8px 12px;border-radius:8px;font-size:12px;opacity:0;transition:opacity 0.3s;z-index:50;text-align:center;max-width:90%}
#win{position:fixed;inset:0;background:rgba(5,5,8,0.97);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;z-index:30}
#win h1{color:#3fc;font-size:24px;text-align:center}
#win p{color:#aaa;font-size:13px;text-align:center}
#win button{padding:14px 30px;background:#f80;color:#111;border:none;border-radius:10px;font-size:15px;font-family:monospace;font-weight:bold}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="hLoc">Футбольный зал</span><span id="hBag">Мешок: 0/10</span><span id="hCoin">💰 0</span></div>
<div id="topBtns">
<button id="pauseBtn">❚❚</button>
<button id="upgBtn2">⬆</button>
<button id="viewBtn">◉</button>
<button id="accBtn">АКК</button>
</div>
<div id="pauseMenu">
<h2>ПАУЗА</h2>
<button id="resumeBtn">ПРОДОЛЖИТЬ</button>
<button id="saveBtn">СОХРАНИТЬ</button>
<button id="netOpen">ИГРАТЬ С ДРУГОМ</button>
<button id="promoOpen">ПРОМОКОД</button>
</div>
<div id="upgMenu">
<h2>ПРОКАЧКА</h2>
<button id="upSpeed"></button>
<button id="upRadius"></button>
<button id="upClose">ЗАКРЫТЬ</button>
</div>
<div id="promoMenu">
<h2>ПРОМОКОД</h2>
<input id="promoInput" placeholder="введи промокод">
<div id="promoMsg"></div>
<button id="promoApply">АКТИВИРОВАТЬ</button>
<button id="promoClose" style="background:#555;color:#eee">ЗАКРЫТЬ</button>
</div>
<div id="accMenu">
<div id="accLoggedOut">
<h2>АККАУНТЫ</h2>
<input id="accNick" placeholder="ник">
<input id="accPass" type="password" placeholder="пароль">
<input id="accPass2" type="password" placeholder="повтор пароля" style="display:none">
<div id="accMsg"></div>
<button id="accLogin">ВОЙТИ</button>
<button id="accReg">ЗАРЕГИСТРИРОВАТЬСЯ</button>
<button id="accClose">ЗАКРЫТЬ</button>
</div>
<div id="accLoggedIn" style="display:none;width:100%;flex-direction:column;align-items:center;gap:10px">
<h2>АККАУНТ</h2>
<div id="accName"></div>
<button id="accLogout">ВЫЙТИ ИЗ АККАУНТА</button>
<button id="accDelete">УДАЛИТЬ АККАУНТ</button>
<input id="accDelPass" type="password" placeholder="введи пароль для удаления" style="display:none">
<div id="accDelMsg" style="color:#f55;font-size:12px;min-height:16px"></div>
<button id="accDelConfirm" style="display:none;background:#c33;color:#fff">ПОДТВЕРДИТЬ УДАЛЕНИЕ</button>
<button id="accBack" style="background:#555;color:#eee">НАЗАД</button>
</div>
</div>
<div id="netMenu">
<h2>ИГРА С ДРУГОМ</h2>
<div id="netCode"></div>
<input id="netInput" placeholder="код комнаты друга">
<div id="netStatus"></div>
<button onclick="netHost()">СОЗДАТЬ ИГРУ</button>
<button onclick="netJoin()">ПОДКЛЮЧИТЬСЯ</button>
<button id="netClose" style="background:#555;color:#eee">ЗАКРЫТЬ</button>
</div>
<div id="netScore"></div>
<div id="joy"><div id="knob"></div></div>
<div id="btn">СОБРАТЬ</div>
<div id="ctx"><button id="ctxSell">СДАТЬ</button><button id="ctxUpg">ОБНОВИТЬ</button><button id="ctxOpen">ОТКРЫТЬ</button></div>
<div id="msg"></div>
<div id="shop"><button id="close">×</button><h2 id="shopTitle"></h2><div id="shopBody"></div></div>
<div id="win"><h1>БУТЫЛКА НАЙДЕНА!</h1><p id="winTxt"></p><button onclick="location.reload()">Играть снова</button></div>

<script>
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');

// ================= МУЛЬТИПЛЕЕР =================
let netMode=false,isHost=false,netConn=null;
let myWins=0,frWins=0;const NET_WINS=3;
let raceOn=false,raceStart=0;

function netSend(m){if(netConn)netConn.send(m);}

function netHost(){
netMode=true;isHost=true;
const peer=new Peer();
peer.on('open',id=>{document.getElementById('netCode').textContent='Твой код: '+id;});
peer.on('connection',c=>{
netConn=c;c.on('data',onNet);
c.on('open',()=>{
document.getElementById('netStatus').textContent='Друг на месте!';setTimeout(netStartRound,800);
});
c.on('close',()=>{toast('Друг отключился');netMode=false;});
});
document.getElementById('netMenu').style.display='none';
}

function netJoin(){
const code=document.getElementById('netInput').value.trim();
if(!code){toast('Введи код!');return;}
netMode=true;
const peer=new Peer();
peer.on('open',()=>{
netConn=peer.connect(code);
netConn.on('data',onNet);
netConn.on('close',()=>{toast('Соединение потеряно');netMode=false;});
});
document.getElementById('netStatus').textContent='Подключаюсь...';
document.getElementById('netMenu').style.display='none';
}

function onNet(m){
if(m.t==='start'){
loc=m.n;genLoc(m.n);
bottle={x:m.bx,y:m.by,r:10};
raceOn=true;raceStart=Date.now();
toast('Раунд! Ищите бутылку');
}
if(m.t==='found'&&raceOn){
raceOn=false;
frWins++;updNetScore();
toast('Друг нашёл за '+(m.ms/1000).toFixed(1)+' с');
netAfterRound();
}
}

function netStartRound(){
const n=1+Math.floor(Math.random()*MAXLOC);
loc=n;genLoc(n);
raceOn=true;raceStart=Date.now();
netSend({t:'start',n:n,bx:bottle.x,by:bottle.y});
toast('Раунд! Ищите бутылку');
}

function netRoundWon(){
raceOn=false;
const ms=Date.now()-raceStart;
netSend({t:'found',ms:ms});
myWins++;updNetScore();
toast('Ты нашёл за '+(ms/1000).toFixed(1)+' с!');
netAfterRound();
}

function netAfterRound(){
if(myWins>=NET_WINS||frWins>=NET_WINS){
const winTxt=document.getElementById('winTxt');
winTxt.textContent=myWins>frWins
?'ТЫ ЧЕМПИОН! Счёт '+myWins+':'+frWins
:'Победил друг. Счёт '+myWins+':'+frWins;
document.getElementById('win').style.display='flex';
}else if(isHost){
setTimeout(netStartRound,3000);
}else{
toast('Ждём следующий раунд...');
}
}

function updNetScore(){
const el=document.getElementById('netScore');
el.style.display='block';
el.textContent=myWins+' : '+frWins;
}

document.getElementById('netOpen').onclick=()=>{paused=true;document.getElementById('netMenu').style.display='flex';};
document.getElementById('netClose').onclick=()=>{paused=false;document.getElementById('netMenu').style.display='none';};

// ================= ПРОМОКОД =================
const promoMenu=document.getElementById('promoMenu');
const promoInput=document.getElementById('promoInput');
const promoMsg=document.getElementById('promoMsg');
document.getElementById('promoOpen').onclick=()=>{document.getElementById('pauseMenu').style.display='none';promoMenu.style.display='flex';promoMsg.textContent='';promoInput.value='';};
document.getElementById('promoClose').onclick=()=>{promoMenu.style.display='none';paused=false;};
document.getElementById('promoApply').onclick=()=>{
const code=promoInput.value.trim().toUpperCase();
if(!code){promoMsg.textContent='Введи промокод';return;}
if(!currentUser){promoMsg.textContent='Сначала войди в аккаунт';return;}
const acc=accGet(currentUser)||{};
const used=acc.promos||{};
if(code==='ADMIN'){
if(used.ADMIN){promoMsg.textContent='Этот промокод уже использован';return;}
coins+=5000;
const closed=[];
for(let i=1;i<=MAXLOC;i++)if(!unlocked[i])closed.push(i);
if(closed.length>0){
const pick=closed[Math.floor(Math.random()*closed.length)];
unlocked[pick]=true;
promoMsg.textContent='+5000 монет, открыта локация '+pick;
}else{
promoMsg.textContent='+5000 монет (все локации уже открыты)';
}
used.ADMIN=true;
accSet(currentUser,{pass:acc.pass,coins:coins,bagMax:bagMax,unlocked:unlocked,speedLvl:speedLvl,radiusLvl:radiusLvl,promos:used});
updHUD();
}else{
promoMsg.textContent='Неверный промокод';
}
};

// ================= ИГРА =================
let W,H;function resize(){W=cvs.width=innerWidth;H=cvs.height=innerHeight;}resize();addEventListener('resize',resize);
const player={x:0,y:0,r:16,speed:3};
let dust=[],bottle=null,bag=0,bagMax=10,coins=0;
const MAXLOC=10;
let loc=1,unlocked={1:true};
const LOC_NAMES=["Футбольный зал","Баскетбольный зал","Бадминтон","Волейбол","Теннисный корт","Зал борьбы","Бассейн","Гимнастический зал","Бокс-ринг","Легкоатлетический манеж"];const LOC_COST={};for(let i=2;i<=MAXLOC;i++)LOC_COST[i]=Math.floor(50*Math.pow(1.6,i-2));
let bottleLoc=MAXLOC-2+Math.floor(Math.random()*3);
let joy={dx:0,dy:0,active:false};
let cleaner={x:0,y:0,r:20},guard={x:0,y:0,r:20};
let collecting=false,collectTimer=0,nearCleaner=false,nearGuard=false,walkPhase=0,paused=false;
let speedLvl=1,radiusLvl=1,currentUser=null;
const ARENA=1400;
let decor=[];
let firstPerson=false;

function rand(a,b){return a+Math.random()*(b-a);}
function bagColor(){if(bagMax>=30)return'#f80';if(bagMax>=25)return'#a4f';if(bagMax>=20)return'#4af';if(bagMax>=15)return'#4f4';return'#aaa';}
function applyUpgrades(){player.speed=3+speedLvl*0.5;}

function clampPlayer(){
const lim=ARENA/2-60;
if(player.x<-lim)player.x=-lim;
if(player.x>lim)player.x=lim;
if(player.y<-lim)player.y=-lim;
if(player.y>lim)player.y=lim;
}

function genLoc(n){
dust=[];bag=0;
const count=70+n*25;
for(let i=0;i<count;i++)dust.push({x:rand(-ARENA/2+80,ARENA/2-80),y:rand(-ARENA/2+80,ARENA/2-80),r:5,hidden:false,rot:Math.random()*6});
bottle=null;
if(netMode){
bottle={x:rand(-ARENA/2+120,ARENA/2-120),y:rand(-ARENA/2+120,ARENA/2-120),r:10};
}else if(n===bottleLoc){
bottle={x:rand(-ARENA/2+120,ARENA/2-120),y:rand(-ARENA/2+120,ARENA/2-120),r:10};
}
cleaner={x:-90,y:ARENA/2-120,r:20};guard={x:90,y:ARENA/2-120,r:20};
player.x=0;player.y=0;
decor=[];
for(let i=0;i<6;i++)decor.push({type:'cone',x:rand(-ARENA/2+200,ARENA/2-200),y:rand(-ARENA/2+200,ARENA/2-200)});
for(let i=0;i<4;i++)decor.push({type:'ball',x:rand(-ARENA/2+200,ARENA/2-200),y:rand(-ARENA/2+200,ARENA/2-200)});
for(let i=0;i<4;i++)decor.push({type:'bench',x:-ARENA/2+200+i*300,y:ARENA/2-120});
document.getElementById('hLoc').textContent=LOC_NAMES[n-1];
updHUD();
}
function updHUD(){const el=document.getElementById('hBag');el.textContent='Мешок: '+bag+'/'+bagMax;el.style.color=bagColor();document.getElementById('hCoin').textContent='💰 '+coins;}
function toast(m){const el=document.getElementById('msg');el.textContent=m;el.style.opacity=1;clearTimeout(el._t);el._t=setTimeout(()=>el.style.opacity=0,1800);}

function accGet(n){return JSON.parse(localStorage.getItem('acc_'+n)||'null');}
function accSet(n,d){localStorage.setItem('acc_'+n,JSON.stringify(d));}
function accDel(n){localStorage.removeItem('acc_'+n);}
function findRealNick(n){
for(let i=0;i<localStorage.length;i++){
const k=localStorage.key(i);
if(k&&k.startsWith('acc_')){
const existNick=k.slice(4);
if(existNick.toLowerCase()===n.toLowerCase())return existNick;
}
}
return null;
}
function loadAcc(){const u=localStorage.getItem('currentUser');if(u){const a=accGet(u);if(a){currentUser=u;coins=a.coins;bagMax=a.bagMax;unlocked=a.unlocked;speedLvl=a.speedLvl;radiusLvl=a.radiusLvl;applyUpgrades();}}}
function saveAcc(){if(!currentUser)return;const a=accGet(currentUser)||{};accSet(currentUser,{pass:a.pass,coins:coins,bagMax:bagMax,unlocked:unlocked,speedLvl:speedLvl,radiusLvl:radiusLvl,promos:a.promos||{}});localStorage.setItem('currentUser',currentUser);}
loadAcc();
genLoc(1);
updHUD();

const joyEl=document.getElementById('joy'),knob=document.getElementById('knob');let joyId=null;
joyEl.addEventListener('touchstart',e=>{e.preventDefault();joyId=e.changedTouches[0].identifier;joy.active=true;updJoy(e.changedTouches[0]);},{passive:false});
joyEl.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===joyId)updJoy(t);},{passive:false});
joyEl.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===joyId){joy.active=false;joy.dx=0;joy.dy=0;knob.style.left='37px';knob.style.top='37px';joyId=null;}});
function updJoy(t){const r=joyEl.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=t.clientX-cx,dy=t.clientY-cy;const max=48,d=Math.hypot(dx,dy);if(d>max){dx=dx/d*max;dy=dy/d*max;}joy.dx=dx/max;joy.dy=dy/max;knob.style.left=(37+dx)+'px';knob.style.top=(37+dy)+'px';}window.addEventListener('blur',()=>{joy.active=false;joy.dx=0;joy.dy=0;collecting=false;knob.style.left='37px';knob.style.top='37px';});

document.getElementById('viewBtn').onclick=()=>{firstPerson=!firstPerson;toast(firstPerson?'Вид от 1 лица':'Вид от 3 лица');};
document.getElementById('pauseBtn').onclick=()=>{paused=true;document.getElementById('pauseMenu').style.display='flex';};
document.getElementById('resumeBtn').onclick=()=>{paused=false;document.getElementById('pauseMenu').style.display='none';};
document.getElementById('saveBtn').onclick=()=>{saveAcc();toast('Прогресс сохранён!');};

const accMenu=document.getElementById('accMenu'),accLoggedOut=document.getElementById('accLoggedOut'),accLoggedIn=document.getElementById('accLoggedIn');
const accNick=document.getElementById('accNick'),accPass=document.getElementById('accPass'),accPass2=document.getElementById('accPass2'),accMsg=document.getElementById('accMsg'),accName=document.getElementById('accName');
function showLoggedOut(){accLoggedOut.style.display='block';accLoggedIn.style.display='none';accMsg.textContent='';accNick.value='';accPass.value='';accPass2.value='';accPass2.style.display='none';document.getElementById('accReg').textContent='ЗАРЕГИСТРИРОВАТЬСЯ';}
function showLoggedIn(){accLoggedOut.style.display='none';accLoggedIn.style.display='flex';accName.textContent='Имя: '+currentUser;document.getElementById('accDelPass').style.display='none';document.getElementById('accDelMsg').textContent='';document.getElementById('accDelConfirm').style.display='none';}
document.getElementById('accBtn').onclick=()=>{accMenu.style.display='flex';paused=true;if(currentUser)showLoggedIn();else showLoggedOut();};
document.getElementById('accClose').onclick=()=>{accMenu.style.display='none';paused=false;};
document.getElementById('accBack').onclick=()=>{accMenu.style.display='none';paused=false;};

document.getElementById('accLogin').onclick=()=>{
const n=accNick.value.trim(),p=accPass.value;
if(!n||!p){accMsg.textContent='Введи ник и пароль';return;}
const realNick=findRealNick(n);
if(!realNick){accMsg.textContent='Аккаунт не найден';return;}
const a=accGet(realNick);
if(!a){accMsg.textContent='Аккаунт не найден';return;}
if(a.pass!==p){accMsg.textContent='Неверный пароль';return;}
currentUser=realNick;coins=a.coins;bagMax=a.bagMax;unlocked=a.unlocked;speedLvl=a.speedLvl;radiusLvl=a.radiusLvl;
applyUpgrades();genLoc(loc);updHUD();saveAcc();showLoggedIn();
};

document.getElementById('accReg').onclick=()=>{
const n=accNick.value.trim(),p=accPass.value;
if(accPass2.style.display==='none'){accPass2.style.display='block';document.getElementById('accReg').textContent='ПОДТВЕРДИТЬ';return;}
const p2=accPass2.value;
if(!n||!p){accMsg.textContent='Введи ник и пароль';return;}
if(p!==p2){accMsg.textContent='Пароли не совпадают';return;}
if(findRealNick(n)){accMsg.textContent='Ник уже занят';return;}
accSet(n,{pass:p,coins:0,bagMax:10,unlocked:{1:true},speedLvl:1,radiusLvl:1,promos:{}});
currentUser=n;coins=0;bagMax=10;unlocked={1:true};speedLvl=1;radiusLvl=1;
applyUpgrades();genLoc(1);updHUD();saveAcc();showLoggedIn();
};

document.getElementById('accLogout').onclick=()=>{saveAcc();currentUser=null;localStorage.removeItem('currentUser');showLoggedOut();accMsg.textContent='Вы вышли из аккаунта';};
document.getElementById('accDelete').onclick=()=>{document.getElementById('accDelPass').style.display='block';document.getElementById('accDelConfirm').style.display='block';document.getElementById('accDelMsg').textContent='';};
document.getElementById('accDelConfirm').onclick=()=>{const p=document.getElementById('accDelPass').value;const msg=document.getElementById('accDelMsg');if(!p){msg.textContent='Введи пароль';return;}const a=accGet(currentUser);if(!a){msg.textContent='Ошибка';return;}if(a.pass!==p){msg.textContent='Неверный пароль';return;}accDel(currentUser);currentUser=null;localStorage.removeItem('currentUser');showLoggedOut();accMsg.textContent='Аккаунт удалён';};const upgMenu=document.getElementById('upgMenu'),upSpeed=document.getElementById('upSpeed'),upRadius=document.getElementById('upRadius');
function speedCost(){return speedLvl*20;}function radiusCost(){return radiusLvl*15;}
function refreshUpg(){upSpeed.textContent='Бег ур.'+speedLvl+' → '+(speedLvl+1)+' за '+speedCost()+' 💰';upRadius.textContent='Радиус ур.'+radiusLvl+' → '+(radiusLvl+1)+' за '+radiusCost()+' 💰';}
document.getElementById('upgBtn2').onclick=()=>{refreshUpg();upgMenu.style.display='flex';paused=true;};
document.getElementById('upClose').onclick=()=>{upgMenu.style.display='none';paused=false;};
upSpeed.onclick=()=>{const c=speedCost();if(coins>=c){coins-=c;speedLvl++;applyUpgrades();updHUD();toast('Бег ур.'+speedLvl);refreshUpg();}else toast('Нужно '+c+' 💰');};
upRadius.onclick=()=>{const c=radiusCost();if(coins>=c){coins-=c;radiusLvl++;updHUD();toast('Радиус ур.'+radiusLvl);refreshUpg();}else toast('Нужно '+c+' 💰');};

const actionBtn=document.getElementById('btn');
actionBtn.addEventListener('touchstart',e=>{e.preventDefault();if(paused)return;collecting=true;collectTimer=0;tryCollect();},{passive:false});
actionBtn.addEventListener('touchend',e=>{e.preventDefault();collecting=false;});
actionBtn.addEventListener('touchcancel',()=>{collecting=false;});

function tryCollect(){
if(bag>=bagMax){toast('Мешок полный!');collecting=false;return;}
for(let i=dust.length-1;i>=0;i--){
const d=dust[i];if(d.hidden)continue;
if(Math.hypot(d.x-player.x,d.y-player.y)<player.r+22+radiusLvl*4){
bag++;updHUD();d.hidden=true;setTimeout(()=>{d.hidden=false;},10000);return;
}
}
if(bottle&&Math.hypot(bottle.x-player.x,bottle.y-player.y)<player.r+24){
bottle=null;
if(netMode){
netRoundWon();
return;
}
document.getElementById('winTxt').textContent='Ты нашёл бутылку в зале «'+LOC_NAMES[loc-1]+'»!';
document.getElementById('win').style.display='flex';
}
}

const ctxMenu=document.getElementById('ctx'),sellBtn=document.getElementById('ctxSell'),upgBtn=document.getElementById('ctxUpg'),openBtn=document.getElementById('ctxOpen');
sellBtn.onclick=()=>{if(bag===0){toast('Мешок пуст');return;}coins+=bag;toast('Сдано '+bag+' пыли');bag=0;updHUD();};
openBtn.onclick=()=>openShop('guard');
upgBtn.onclick=()=>openShop('upgrade');

const shop=document.getElementById('shop'),shopBody=document.getElementById('shopBody'),shopTitle=document.getElementById('shopTitle');
function openShop(type){
shop.style.display='flex';shopBody.innerHTML='';
if(type==='guard'){
shopTitle.textContent='Охранник — локации';
for(let i=1;i<=MAXLOC;i++){
const b=document.createElement('button');b.className='loc-btn';
if(unlocked[i]){b.textContent=LOC_NAMES[i-1]+' (открыт)';b.onclick=()=>{loc=i;genLoc(i);shop.style.display='none';};}
else{b.textContent=LOC_NAMES[i-1]+' — '+LOC_COST[i]+' 💰';b.onclick=()=>tryUnlock(i);}
b.style.marginTop='6px';shopBody.appendChild(b);
}
}else{
shopTitle.textContent='Уборщик — прокачка';
const cost=bagMax*2;
const b=document.createElement('button');b.className='loc-btn';
b.textContent='Прокачать мешок: '+bagMax+' → '+(bagMax+5)+' за '+cost+' 💰';
b.style.borderColor=bagColor();b.style.color=bagColor();
b.onclick=()=>{if(coins>=cost){coins-=cost;bagMax+=5;updHUD();toast('Мешок прокачан');openShop('upgrade');}else toast('Нужно '+cost+' 💰');};
shopBody.appendChild(b);
}
}
document.getElementById('close').onclick=()=>shop.style.display='none';
function tryUnlock(n){if(unlocked[n])return;if(coins>=LOC_COST[n]){coins-=LOC_COST[n];unlocked[n]=true;updHUD();toast(LOC_NAMES[n-1]+' открыт!');openShop('guard');}else toast('Нужно '+LOC_COST[n]+' 💰');}

const FLOOR_COLORS=['#4a7a4a','#9a6a3a','#3a7a8a','#7a3a7a','#3a8a5a','#6a3a3a','#2a6a8a','#6a6a8a','#7a2a2a','#5a7a3a'];
const WALL_COLORS=['#5a7a5a','#8a6a4a','#4a7a8a','#7a4a7a','#4a8a6a','#6a4a4a','#3a6a8a','#6a6a8a','#8a3a3a','#5a7a4a'];

function drawWallSide(x,y,w,h,base){
const g=ctx.createLinearGradient(x,y,x,y+h);
g.addColorStop(0,'#ffffff33');
g.addColorStop(0.08,base);g.addColorStop(1,'#00000066');
ctx.fillStyle=g;
ctx.fillRect(x,y,w,h);
}

function drawDecor(n){
const S=ARENA;
if(n===1){
ctx.strokeStyle='#eee';ctx.lineWidth=4;
ctx.strokeRect(-S/2+40,-120,40,240);
ctx.strokeRect(S/2-80,-120,40,240);
ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1;
for(let i=-120;i<=120;i+=20){ctx.beginPath();ctx.moveTo(-S/2+40,i);ctx.lineTo(-S/2+80,i);ctx.stroke();ctx.beginPath();ctx.moveTo(S/2-80,i);ctx.lineTo(S/2-40,i);ctx.stroke();}
}
if(n===2){
[[-S/2+120,0],[S/2-120,0]].forEach(([x,y])=>{
ctx.fillStyle='#aaa';ctx.fillRect(x-4,y-60,8,120);
ctx.fillStyle='#c84a1a';ctx.beginPath();ctx.arc(x,y,14,0,7);ctx.fill();
ctx.strokeStyle='#eee';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,14,0,7);ctx.stroke();
ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=1;
for(let a=0;a<Math.PI*2;a+=0.5){ctx.beginPath();ctx.moveTo(x+Math.cos(a)*14,y+Math.sin(a)*14);ctx.lineTo(x+Math.cos(a)*24,y+Math.sin(a)*24);ctx.stroke();}
});
}
if(n===3){
ctx.strokeStyle='#fff';ctx.lineWidth=2;
ctx.beginPath();ctx.moveTo(-S/2+80,0);ctx.lineTo(S/2-80,0);ctx.stroke();
for(let x=-S/2+80;x<S/2-80;x+=24){ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.beginPath();ctx.moveTo(x,-20);ctx.lineTo(x,20);ctx.stroke();}
}
if(n===4){
ctx.fillStyle='#888';
ctx.fillRect(-S/2+100,-40,10,80);ctx.fillRect(S/2-110,-40,10,80);
ctx.strokeStyle='#fff';ctx.lineWidth=2;
ctx.beginPath();ctx.moveTo(-S/2+100,-30);ctx.lineTo(S/2-110,-30);ctx.stroke();
for(let x=-S/2+100;x<S/2-110;x+=20){ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.beginPath();ctx.moveTo(x,-30);ctx.lineTo(x,30);ctx.stroke();}
}
if(n===5){
ctx.strokeStyle='#fff';ctx.lineWidth=2;
ctx.beginPath();ctx.moveTo(0,-S/2+120);ctx.lineTo(0,S/2-120);ctx.stroke();
for(let y=-S/2+120;y<S/2-120;y+=22){ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.beginPath();ctx.moveTo(-20,y);ctx.lineTo(20,y);ctx.stroke();}
}
if(n===6){
ctx.fillStyle='#a83a3a';ctx.fillRect(-300,-300,600,600);
ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.strokeRect(-300,-300,600,600);
ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.strokeRect(-200,-200,400,400);
}
if(n===7){
ctx.fillStyle='#1a5a8a';ctx.fillRect(-400,-300,800,600);
ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=2;
for(let y=-300;y<=300;y+=100){ctx.beginPath();ctx.moveTo(-400,y);ctx.lineTo(400,y);ctx.stroke();}
}
if(n===8){
ctx.fillStyle='#3a6a8a';ctx.fillRect(-300,-200,600,400);
ctx.fillStyle='#8a6a3a';ctx.fillRect(-80,-40,160,80);
ctx.fillStyle='#ddd';ctx.fillRect(-60,-60,120,20);
}
if(n===9){
ctx.fillStyle='#2a4a6a';ctx.fillRect(-320,-320,640,640);
ctx.strokeStyle='#fff';ctx.lineWidth=6;ctx.strokeRect(-300,-300,600,600);
ctx.strokeStyle='#c33';ctx.lineWidth=3;ctx.strokeRect(-280,-280,560,560);
}
if(n===10){
ctx.fillStyle='#8a4a2a';ctx.fillRect(-500,-300,1000,600);
ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=2;
for(let y=-300;y<=300;y+=80){ctx.beginPath();ctx.moveTo(-500,y);ctx.lineTo(500,y);ctx.stroke();}
}
decor.forEach(o=>{
if(o.type==='cone'){
ctx.fillStyle='#f80';
ctx.beginPath();ctx.moveTo(o.x,o.y-14);ctx.lineTo(o.x-10,o.y+10);ctx.lineTo(o.x+10,o.y+10);ctx.closePath();ctx.fill();
}else if(o.type==='ball'){
ctx.fillStyle='#eee';ctx.beginPath();ctx.arc(o.x,o.y,10,0,7);ctx.fill();
ctx.strokeStyle='#222';ctx.lineWidth=1;ctx.beginPath();ctx.arc(o.x,o.y,10,0,7);ctx.stroke();
}else if(o.type==='bench'){
ctx.fillStyle='#6a4a2a';
ctx.fillRect(o.x,o.y,120,20);ctx.fillRect(o.x+10,o.y+20,10,20);ctx.fillRect(o.x+100,o.y+20,10,20);
}
});
}

function drawFloor(n){
const fc=FLOOR_COLORS[n-1],wc=WALL_COLORS[n-1];
const g=ctx.createRadialGradient(W/2,H/2,60,W/2,H/2,Math.max(W,H));
g.addColorStop(0,fc);g.addColorStop(1,'#151515');
ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
const zoom=firstPerson?1.6:1;
ctx.save();ctx.translate(W/2-player.x*zoom,H/2-player.y*zoom);ctx.scale(zoom,zoom);
const S=ARENA;
drawWallSide(-S/2-60,-S/2-60,60,S+120,wc);
drawWallSide(S/2,-S/2-60,60,S+120,wc);
drawWallSide(-S/2-60,-S/2-60,S+120,60,wc);
drawWallSide(-S/2-60,S/2,S+120,60,wc);ctx.fillStyle='rgba(0,0,0,0.25)';
for(let x=-S/2;x<S/2;x+=140){
ctx.fillRect(x,-S/2-60,8,60);
ctx.fillRect(x,S/2,8,60);
}
for(let y=-S/2;y<S/2;y+=140){
ctx.fillRect(-S/2-60,y,60,8);
ctx.fillRect(S/2,y,60,8);
}
for(let s=0;s<3;s++){
const off=80+s*28;
ctx.fillStyle=`rgba(${90-s*15},${90-s*15},${90-s*15},0.5)`;
ctx.fillRect(-S/2+off,-S/2+off,S-off*2,10);
ctx.fillRect(-S/2+off,S/2-off-10,S-off*2,10);
}
ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=3;
ctx.strokeRect(-S/2,-S/2,S,S);
ctx.beginPath();ctx.moveTo(0,-S/2);ctx.lineTo(0,S/2);ctx.stroke();
ctx.beginPath();ctx.arc(0,0,140,0,7);ctx.stroke();
ctx.beginPath();ctx.arc(0,0,70,0,7);ctx.stroke();
for(let gx=-S/2;gx<S/2;gx+=60){ctx.strokeStyle='rgba(0,0,0,0.14)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(gx,-S/2);ctx.lineTo(gx,S/2);ctx.stroke();}
for(let gy=-S/2;gy<S/2;gy+=60){ctx.strokeStyle='rgba(0,0,0,0.14)';ctx.beginPath();ctx.moveTo(-S/2,gy);ctx.lineTo(S/2,gy);ctx.stroke();}
drawDecor(n);
const lights=[[-S/3,-S/3],[S/3,-S/3],[-S/3,S/3],[S/3,S/3],[0,0]];
lights.forEach(([lx,ly])=>{
const lg=ctx.createRadialGradient(lx,ly,10,lx,ly,220);
lg.addColorStop(0,'rgba(255,240,200,0.22)');
lg.addColorStop(1,'rgba(255,240,200,0)');
ctx.fillStyle=lg;ctx.beginPath();ctx.arc(lx,ly,220,0,7);ctx.fill();
ctx.fillStyle='rgba(255,255,230,0.9)';
ctx.beginPath();ctx.arc(lx,ly,7,0,7);ctx.fill();
});
ctx.restore();
}

function drawShadow(x,y,r){
ctx.save();ctx.translate(x,y);
ctx.fillStyle='rgba(0,0,0,0.45)';
ctx.beginPath();ctx.ellipse(0,r*0.9,r*1.1,r*0.4,0,0,7);ctx.fill();
ctx.restore();
}

function drawHuman(px,py,shirt,shorts,hat,item,moving,isPlayer){
drawShadow(px,py,20);
ctx.save();ctx.translate(px,py);
const sw=moving?Math.sin(walkPhase)*4:0,aw=moving?Math.sin(walkPhase)*3:0;
const legGrad=ctx.createLinearGradient(-10,0,10,14);
legGrad.addColorStop(0,shorts);legGrad.addColorStop(1,'#000');
ctx.fillStyle=legGrad;
ctx.fillRect(-8+sw*0.3,2,6,12);ctx.fillRect(2-sw*0.3,2,6,12);
ctx.fillStyle='#222';
ctx.beginPath();ctx.roundRect(-10+sw,12,9,6,2);ctx.fill();
ctx.beginPath();ctx.roundRect(1-sw,12,9,6,2);ctx.fill();
ctx.fillStyle='#ddd';
ctx.fillRect(-10+sw,16,9,2);ctx.fillRect(1-sw,16,9,2);
const shirtGrad=ctx.createLinearGradient(-10,-12,10,6);
shirtGrad.addColorStop(0,'#fff');shirtGrad.addColorStop(0.18,shirt);shirtGrad.addColorStop(1,'#000');
ctx.fillStyle=shirtGrad;
ctx.beginPath();ctx.roundRect(-10,-10,20,16,5);ctx.fill();
ctx.strokeStyle='rgba(0,0,0,0.18)';ctx.lineWidth=1;
ctx.beginPath();ctx.moveTo(-6,-8);ctx.lineTo(-4,4);ctx.stroke();
ctx.beginPath();ctx.moveTo(6,-8);ctx.lineTo(4,4);ctx.stroke();
ctx.fillStyle='#d8a878';ctx.fillRect(-3,-13,6,4);
ctx.fillStyle='#e8b98a';
ctx.fillRect(-14,-8+aw,4,11);ctx.fillRect(10,-8-aw,4,11);
ctx.fillStyle='#d8a878';
ctx.beginPath();ctx.arc(-12,-3+aw,2.2,0,7);ctx.fill();
ctx.beginPath();ctx.arc(12,-3-aw,2.2,0,7);ctx.fill();
const headGrad=ctx.createRadialGradient(-3,-21,2,0,-18,9);
headGrad.addColorStop(0,'#ffe0c0');headGrad.addColorStop(1,'#c89070');
ctx.fillStyle=headGrad;
ctx.beginPath();ctx.ellipse(0,-18,7.5,8.5,0,0,7);ctx.fill();
ctx.fillStyle='#3a2418';
ctx.beginPath();ctx.arc(0,-20,7.8,Math.PI,0);ctx.fill();
ctx.fillRect(-7.8,-20,1.6,4);
ctx.fillStyle='#222';
ctx.beginPath();ctx.arc(-3,-17,1.1,0,7);ctx.fill();
ctx.beginPath();ctx.arc(3,-17,1.1,0,7);ctx.fill();
ctx.strokeStyle='#222';ctx.lineWidth=1;
ctx.beginPath();ctx.moveTo(-5,-20);ctx.lineTo(-1.5,-20.5);ctx.stroke();
ctx.beginPath();ctx.moveTo(5,-20);ctx.lineTo(1.5,-20.5);ctx.stroke();
ctx.strokeStyle='#8a4a3a';ctx.lineWidth=1;
ctx.beginPath();ctx.arc(0,-14,2,0.2,Math.PI-0.2);ctx.stroke();
if(hat){ctx.fillStyle=hat;ctx.fillRect(-8,-28,16,6);}
if(item==='mop'){
ctx.strokeStyle='#8a5a2a';ctx.lineWidth=2;
ctx.beginPath();ctx.moveTo(14,-6);ctx.lineTo(20,14);ctx.stroke();
ctx.fillStyle='#ccc';ctx.fillRect(17,12,8,4);
}
if(item==='badge'){ctx.fillStyle='#ffd700';ctx.fillRect(-4,-6,8,6);}
if(item==='bag'){ctx.fillStyle=bagColor();ctx.fillRect(10,-2,10,12);}
ctx.restore();
}function drawDust3D(d){
if(d.hidden)return;
const t=performance.now()*0.002;
const bob=Math.sin(t+d.rot)*0.8;
ctx.save();
ctx.translate(d.x,d.y+bob);
ctx.fillStyle='rgba(0,0,0,0.35)';
ctx.beginPath();ctx.ellipse(0,d.r*0.6,d.r*0.9,d.r*0.35,0,0,7);ctx.fill();
ctx.rotate(d.rot+t*0.2);
const g=ctx.createRadialGradient(-d.r*0.4,-d.r*0.4,d.r*0.2,0,0,d.r*1.4);
g.addColorStop(0,'#f0e2b8');
g.addColorStop(0.45,'#b8a070');
g.addColorStop(1,'#4a3a1a');
ctx.fillStyle=g;
ctx.beginPath();
for(let a=0;a<Math.PI*2;a+=Math.PI/5){
const rr=d.r*(0.85+Math.sin(a*3+d.rot)*0.18);
ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);
}
ctx.closePath();ctx.fill();
ctx.fillStyle='rgba(60,40,15,0.55)';
for(let i=0;i<4;i++){
const a=d.rot+i*1.7;
ctx.beginPath();
ctx.arc(Math.cos(a)*d.r*0.4,Math.sin(a)*d.r*0.4,d.r*0.16,0,7);
ctx.fill();
}
ctx.fillStyle='rgba(255,250,220,0.75)';
ctx.beginPath();
ctx.arc(-d.r*0.35,-d.r*0.35,d.r*0.3,0,7);
ctx.fill();
ctx.restore();
}

function drawBottle3D(b){
ctx.save();ctx.translate(b.x,b.y);
const gl=ctx.createRadialGradient(0,0,2,0,0,24);
gl.addColorStop(0,'rgba(60,255,200,0.6)');gl.addColorStop(1,'rgba(60,255,200,0)');
ctx.fillStyle=gl;ctx.beginPath();ctx.arc(0,0,24,0,7);ctx.fill();
ctx.fillStyle='#2a9a7a';
ctx.beginPath();ctx.roundRect(-5,-14,10,20,3);ctx.fill();
ctx.fillStyle='#3fc';ctx.fillRect(-3,-20,6,6);
ctx.fillStyle='#1a6a4a';ctx.fillRect(-4,-8,8,2);
ctx.fillStyle='rgba(255,255,255,0.6)';ctx.fillRect(-3,-12,2,12);
ctx.restore();
}

function drawLoc(n){
drawFloor(n);
const zoom=firstPerson?1.6:1;
ctx.save();ctx.translate(W/2-player.x*zoom,H/2-player.y*zoom);ctx.scale(zoom,zoom);
dust.forEach(drawDust3D);
if(bottle)drawBottle3D(bottle);
drawHuman(cleaner.x,cleaner.y,'#3a7a3a','#2a4a2a','#2a5a2a','mop',false,false);
drawHuman(guard.x,guard.y,'#2a2a5a','#111','#111','badge',false,false);
if(!firstPerson){
drawHuman(player.x,player.y,'#e33','#1e5aa8',null,'bag',joy.active&&(Math.abs(joy.dx)>0.1||Math.abs(joy.dy)>0.1),true);
}
ctx.restore();
if(firstPerson){
ctx.fillStyle='rgba(0,0,0,0.25)';
ctx.fillRect(0,0,W,40);
ctx.fillStyle='rgba(255,140,0,0.8)';
ctx.font='bold 14px monospace';
ctx.fillText('ВИД ОТ 1 ЛИЦА',12,26);
}
}

if(!CanvasRenderingContext2D.prototype.roundRect){
CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
if(r>w/2)r=w/2;if(r>h/2)r=h/2;
this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;
};
}

let lastT=0;
function loop(t){
const dt=Math.min(50,t-lastT);lastT=t;
if(!paused){
if(joy.active){player.x+=joy.dx*player.speed;player.y+=joy.dy*player.speed;}
if(joy.active&&(Math.abs(joy.dx)>0.1||Math.abs(joy.dy)>0.1))walkPhase+=dt*0.02;
clampPlayer();
if(collecting){collectTimer+=dt;if(collectTimer>120){collectTimer=0;tryCollect();}}
nearCleaner=Math.hypot(cleaner.x-player.x,cleaner.y-player.y)<player.r+45;
nearGuard=Math.hypot(guard.x-player.x,guard.y-player.y)<player.r+45;
sellBtn.style.display=nearCleaner?'inline-block':'none';
upgBtn.style.display=nearCleaner?'inline-block':'none';
openBtn.style.display=nearGuard?'inline-block':'none';
ctxMenu.style.display=(nearCleaner||nearGuard)?'flex':'none';
}
drawLoc(loc);
requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
